name: Build CyberPet.exe

on:
  push:
    branches:
      - main
      - claude/cyber-pet-animated-i0ukqk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Compilar el ejecutable
        run: pyinstaller --onefile --noconsole --name CyberPet cyber_pet.py

      - name: Publicar CyberPet.exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CyberPet-Windows
          path: dist/CyberPet.exe

      - name: Subir CyberPet.exe a la rama (descarga directa)
        shell: bash
        run: |
          cp dist/CyberPet.exe /tmp/CyberPet.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Sin rebase de binarios: se reconstruye el commit sobre el origin
          # más reciente y se reintenta si otra ejecución empujó primero.
          for intento in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
            cp /tmp/CyberPet.exe CyberPet.exe
            git add CyberPet.exe
            if ! git commit -m "Actualizar CyberPet.exe compilado [skip ci]"; then
              echo "sin cambios que subir"
              break
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            echo "push rechazado, reintento ${intento}"
            sleep 5
          done

      - name: Publicar release con descarga directa
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete descarga --cleanup-tag --yes || true
          gh release create descarga dist/CyberPet.exe \
            --target "${GITHUB_SHA}" \
            --title "CyberPet — descarga directa" \
            --notes "Descarga **CyberPet.exe**, doble clic y listo. Si Windows muestra el aviso de SmartScreen: pulsa 'Más información' y luego 'Ejecutar de todas formas' (el aviso sale solo porque el ejecutable no está firmado)." \
            || gh release upload descarga dist/CyberPet.exe --clobber
