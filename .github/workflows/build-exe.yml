name: Build CyberPet.exe

on:
  push:
    branches:
      - main
      - claude/cyber-pet-animated-i0ukqk
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Compilar el ejecutable
        run: pyinstaller --onefile --noconsole --name CyberPet cyber_pet.py

      - name: Publicar CyberPet.exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CyberPet-Windows
          path: dist/CyberPet.exe
