<svg xmlns="http://www.w3.org/2000/svg" width="800" height="860" viewBox="0 0 800 860">
  <defs>
    <radialGradient id="ballG" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#7cb8ee"/>
      <stop offset="100%" stop-color="#2f6fc0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfe7fb"/>
      <stop offset="60%" stop-color="#cfe7fb"/>
      <stop offset="100%" stop-color="#cfe7fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerG" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#e8f5ff"/>
      <stop offset="60%" stop-color="#a8d2f7"/>
      <stop offset="100%" stop-color="#7fbcf2"/>
    </radialGradient>
    <radialGradient id="heartG" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#dff0ff"/>
      <stop offset="100%" stop-color="#4fa4f2"/>
    </radialGradient>
  </defs>

  <!-- antena -->
  <rect x="394" y="96" width="12" height="50" rx="5" fill="#c9ced6" stroke="#2a2d33" stroke-width="3"/>
  <circle cx="400" cy="78" r="27" fill="url(#ballG)" stroke="#2a2d33" stroke-width="5"/>

  <!-- cuello (queda detrás de cabeza y torso) -->
  <rect x="356" y="478" width="88" height="46" rx="18" fill="#ffffff" stroke="#2a2d33" stroke-width="7"/>

  <!-- brazo derecho colgando (detrás del torso) -->
  <line x1="520" y1="570" x2="562" y2="692" stroke="#2a2d33" stroke-width="52" stroke-linecap="round"/>
  <line x1="520" y1="570" x2="562" y2="692" stroke="#ffffff" stroke-width="38" stroke-linecap="round"/>

  <!-- piernas y botas -->
  <rect x="312" y="715" width="66" height="80" rx="26" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <rect x="422" y="715" width="66" height="80" rx="26" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <ellipse cx="340" cy="810" rx="62" ry="42" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <path d="M 296 790 q -14 22 2 44" fill="none" stroke="#2a2d33" stroke-width="5"/>
  <ellipse cx="460" cy="810" rx="62" ry="42" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <path d="M 504 790 q 14 22 -2 44" fill="none" stroke="#2a2d33" stroke-width="5"/>

  <!-- torso -->
  <ellipse cx="400" cy="630" rx="152" ry="128" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <path d="M 262 660 A 130 108 0 0 0 380 752" fill="none" stroke="#e9eef2" stroke-width="12"/>

  <!-- insignia -->
  <circle cx="400" cy="625" r="95" fill="url(#glowG)"/>
  <circle cx="400" cy="625" r="76" fill="#57a2ec" stroke="#2b6ec2" stroke-width="7"/>
  <circle cx="400" cy="625" r="62" fill="url(#innerG)"/>
  <path d="M 352 622 L 400 578 L 448 622 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <rect x="366" y="620" width="68" height="46" rx="8" fill="#ffffff"/>
  <path d="M 444 660 C 414 638 419 610 444 618 C 469 610 474 638 444 660 Z"
        fill="url(#heartG)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>

  <!-- antebrazo derecho visible: banda y puño -->
  <line x1="580" y1="668" x2="534" y2="682" stroke="#3f87d8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="560" cy="700" r="36" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <path d="M 540 690 Q 560 678 580 690" fill="none" stroke="#2a2d33" stroke-width="6"/>

  <!-- cabeza -->
  <ellipse cx="400" cy="305" rx="212" ry="188" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <path d="M 214 350 A 190 165 0 0 0 380 486" fill="none" stroke="#e9eef2" stroke-width="14"/>

  <!-- orejas -->
  <ellipse cx="168" cy="320" rx="42" ry="66" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <ellipse cx="176" cy="320" rx="26" ry="48" fill="#3f87d8" stroke="#1f5fae" stroke-width="6"/>
  <ellipse cx="632" cy="320" rx="42" ry="66" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <ellipse cx="624" cy="320" rx="26" ry="48" fill="#3f87d8" stroke="#1f5fae" stroke-width="6"/>

  <!-- visor -->
  <rect x="228" y="208" width="344" height="218" rx="76" fill="#3f87d8" stroke="#2a2d33" stroke-width="8"/>
  <rect x="241" y="220" width="318" height="194" rx="64" fill="#0c0d10"/>
  <path d="M 438 234 Q 522 244 550 305" fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round"/>

  <!-- cejas -->
  <path d="M 296 268 Q 328 250 360 264" fill="none" stroke="#3f87d8" stroke-width="14" stroke-linecap="round"/>
  <path d="M 440 264 Q 472 250 504 268" fill="none" stroke="#3f87d8" stroke-width="14" stroke-linecap="round"/>

  <!-- ojos -->
  <circle cx="330" cy="332" r="48" fill="#ffffff"/>
  <circle cx="330" cy="332" r="34" fill="#0c0d10"/>
  <circle cx="318" cy="318" r="11" fill="#ffffff"/>
  <circle cx="344" cy="346" r="5" fill="#ffffff"/>
  <circle cx="470" cy="332" r="48" fill="#ffffff"/>
  <circle cx="470" cy="332" r="34" fill="#0c0d10"/>
  <circle cx="458" cy="318" r="11" fill="#ffffff"/>
  <circle cx="484" cy="346" r="5" fill="#ffffff"/>

  <!-- boca -->
  <path d="M 378 382 A 22 18 0 0 0 422 382 Z" fill="#ffffff"/>

  <!-- brazo izquierdo levantado -->
  <line x1="280" y1="558" x2="196" y2="432" stroke="#2a2d33" stroke-width="52" stroke-linecap="round"/>
  <line x1="280" y1="558" x2="196" y2="432" stroke="#ffffff" stroke-width="38" stroke-linecap="round"/>
  <line x1="230" y1="437" x2="186" y2="466" stroke="#3f87d8" stroke-width="12" stroke-linecap="round"/>

  <!-- guante: dedos, pulgar y palma -->
  <g stroke-linecap="round">
    <line x1="152" y1="350" x2="120" y2="290" stroke="#2a2d33" stroke-width="30"/>
    <line x1="152" y1="350" x2="120" y2="290" stroke="#ffffff" stroke-width="20"/>
    <line x1="164" y1="348" x2="153" y2="281" stroke="#2a2d33" stroke-width="30"/>
    <line x1="164" y1="348" x2="153" y2="281" stroke="#ffffff" stroke-width="20"/>
    <line x1="178" y1="350" x2="189" y2="284" stroke="#2a2d33" stroke-width="30"/>
    <line x1="178" y1="350" x2="189" y2="284" stroke="#ffffff" stroke-width="20"/>
    <line x1="190" y1="358" x2="220" y2="302" stroke="#2a2d33" stroke-width="30"/>
    <line x1="190" y1="358" x2="220" y2="302" stroke="#ffffff" stroke-width="20"/>
    <line x1="198" y1="398" x2="236" y2="390" stroke="#2a2d33" stroke-width="30"/>
    <line x1="198" y1="398" x2="236" y2="390" stroke="#ffffff" stroke-width="20"/>
  </g>
  <circle cx="170" cy="386" r="46" fill="#ffffff" stroke="#2a2d33" stroke-width="8"/>
  <path d="M 140 404 Q 168 424 200 402" fill="none" stroke="#2a2d33" stroke-width="5"/>
</svg>
